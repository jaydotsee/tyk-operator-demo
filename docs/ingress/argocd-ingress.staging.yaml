# ---------------------------------------------------------------------------
# ArgoCD UI behind ingress-nginx -- staging cluster
# ---------------------------------------------------------------------------
#   kubectl config use-context staging
#   kubectl apply -f docs/ingress/argocd-ingress.staging.yaml
#
# REQUIRES argocd-server to be running in insecure mode first, otherwise you
# get a redirect loop: argocd-server serves TLS on its own port by default, and
# nginx would be speaking HTTP to an HTTPS backend.
#
#   kubectl -n argocd patch configmap argocd-cmd-params-cm \
#     --type merge -p '{"data":{"server.insecure":"true"}}'
#   kubectl -n argocd rollout restart deployment argocd-server
#
# "Insecure" here means ArgoCD stops terminating TLS itself, not that TLS is
# gone -- the ingress (or your load balancer) terminates it instead. On this
# local setup nothing terminates it, so the UI is plain HTTP; see the guide.
# ---------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tyk-operator-demo
  annotations:
    # argocd-server is plain HTTP once server.insecure is set.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.staging.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
