# ---------------------------------------------------------------------------
# Stable, host-reachable endpoints for the Tyk stack and ArgoCD on Minikube
# ---------------------------------------------------------------------------
# Apply this to EACH cluster (staging and production). The NodePort numbers are
# identical in both, because they are separate clusters; the clusters are told
# apart on the host by the `minikube start --ports` mapping, not by these numbers.
#
#   kubectl config use-context staging      # then again for production
#   kubectl apply -f docs/nodeport-services.yaml
#
# WHY THESE EXIST RATHER THAN `service.type: NodePort` IN THE HELM VALUES
#
# The tyk-charts service templates render only `type`, `port`, `targetPort`,
# `protocol` and `name` -- there is no `nodePort` field. Setting the chart's
# service type to NodePort therefore gets you a RANDOM port in 30000-32767,
# which is useless when `minikube start --ports` has to know the number in
# advance. These are additional Services alongside the chart's own; they select
# the same pods and leave the chart-managed Services untouched, so a
# `helm upgrade` cannot clobber them.
#
# WHY externalTrafficPolicy: Local
#
# It preserves the client source IP instead of SNAT-ing it to the node address.
# On single-node Minikube every pod is on the receiving node, so the usual
# "Local drops traffic to pods on other nodes" caveat does not apply. Preserving
# the client IP is what you want when your own load balancer sits in front and
# you care about IP-based rules or accurate analytics.
#
# NOTE: the source IP the Gateway sees is NOT 127.0.0.1 through this path. The
# staging overlay's `enable_ip_whitelisting` / `allowed_ips: [127.0.0.1]` will
# reject every request until you widen it. See "Exposing both clusters to the
# host" in minikube-setup.md.
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: tyk-gateway-nodeport
  namespace: tyk
  labels:
    app.kubernetes.io/part-of: tyk-operator-demo
spec:
  type: NodePort
  externalTrafficPolicy: Local
  # Matches the pod labels rendered by the tyk-gateway subchart for a release
  # named `tyk`: app: gateway-<release>-<chart>, release: <release>.
  selector:
    app: gateway-tyk-tyk-gateway
    release: tyk
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: tyk-dashboard-nodeport
  namespace: tyk
  labels:
    app.kubernetes.io/part-of: tyk-operator-demo
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: dashboard-tyk-tyk-dashboard
    release: tyk
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tyk-operator-demo
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    # argocd-server serves TLS on 8080 by default, so this is HTTPS unless you
    # set `server.insecure: "true"` in the argocd-cmd-params-cm ConfigMap.
    - name: https
      port: 443
      targetPort: 8080
      nodePort: 30443
      protocol: TCP
